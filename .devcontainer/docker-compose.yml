version: "3.8"

services:
  dev:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    init: true
    volumes:
      - ..:/workspaces/${LOCAL_WORKSPACE_FOLDER_NAME:-app}:cached
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/workspaces/${LOCAL_WORKSPACE_FOLDER_NAME:-app}/target
    working_dir: /workspaces/${LOCAL_WORKSPACE_FOLDER_NAME:-app}
    command: sleep infinity
    depends_on:
      - postgres
      - mysql
      - redis
      - wp
      - caddy
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      POSTGRES_URL: ${POSTGRES_URL:-postgres://panel:panel@postgres:5432/panel}
      DATABASE_URL: ${DATABASE_URL:-postgres://panel:panel@postgres:5432/panel}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_USER: ${MYSQL_USER:-wp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wp}
      ORIGIN_BASE: ${ORIGIN_BASE:-http://caddy}
      SITE_HOST: ${SITE_HOST:-mysite.local.test}
    networks: [devnet]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: panel
      POSTGRES_PASSWORD: panel
      POSTGRES_DB: panel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panel"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [devnet]

  mysql:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [devnet]

  wp:
    image: wordpress:php8.3-fpm
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wpdata:/var/www/html
    networks: [devnet]

  caddy:
    image: caddy:2
    depends_on: [wp]
    ports:
      - "8080:80"
      - "8001:8000"
    volumes:
      - wpdata:/var/www/html
      - ./.devcontainer/Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [devnet]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [devnet]

volumes:
  pgdata: {}
  dbdata: {}
  wpdata: {}
  cargo-cache: {}
  target-cache: {}

networks:
  devnet: {}
